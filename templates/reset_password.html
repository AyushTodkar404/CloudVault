{% extends "base.html" %}

{% block title %}Set New Password &mdash; CloudVault{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-white border border-[#E9EAEC] rounded-2xl p-7 sm:p-8 shadow-xs relative overflow-hidden">
    
    <!-- Header -->
    <div class="text-center space-y-2 mb-6">
      <div class="w-10 h-10 rounded-xl bg-stone-100 border border-stone-200 text-stone-700 flex items-center justify-center text-sm mx-auto shadow-xs">
        <i class="fa-solid fa-lock text-sm"></i>
      </div>
      <h1 class="text-xl font-bold text-[#1C1917] tracking-tight">Set new password</h1>
      <p class="text-xs text-[#78716C]">Create a strong password for <strong class="text-[#1C1917]">{{ user.username }}</strong></p>
    </div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="space-y-4" onsubmit="return validateResetPasswordForm(event)">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      
      <!-- New Password -->
      <div>
        <label for="password" class="block text-xs font-medium text-stone-700 mb-1.5">
          New password <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-solid fa-key text-xs"></i>
          </span>
          <input 
            type="password" 
            name="password" 
            id="password" 
            required 
            minlength="6"
            placeholder="At least 6 characters"
            class="wm-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
            oninput="checkPasswordMatch()"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#777B83] hover:text-[#202124] transition-colors"
            aria-label="Toggle password visibility"
          >
            <i class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-medium text-stone-700 mb-1.5">
          Confirm password <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-solid fa-shield-halved text-xs"></i>
          </span>
          <input 
            type="password" 
            name="confirm_password" 
            id="confirm_password" 
            required 
            minlength="6"
            placeholder="Re-enter password"
            class="wm-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
            oninput="checkPasswordMatch()"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility('confirm_password', this)" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#777B83] hover:text-[#202124] transition-colors"
            aria-label="Toggle password visibility"
          >
            <i class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
        <p id="passwordMismatchError" class="text-[11px] text-rose-600 font-mono mt-1 hidden flex items-center gap-1">
          <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.
        </p>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          id="submitResetBtn"
          class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-white bg-[#9F1239] hover:bg-[#881337] active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-xs"
        >
          <i class="fa-solid fa-check text-xs"></i>
          <span>Save new password</span>
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
      field.type = 'text';
      icon.className = 'fa-regular fa-eye-slash text-xs text-[#F0445E]';
    } else {
      field.type = 'password';
      icon.className = 'fa-regular fa-eye text-xs';
    }
  }

  function checkPasswordMatch() {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirm_password').value;
    const err = document.getElementById('passwordMismatchError');
    if (p2.length > 0 && p1 !== p2) {
      err.classList.remove('hidden');
    } else {
      err.classList.add('hidden');
    }
  }

  function validateResetPasswordForm(e) {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirm_password').value;
    if (p1 !== p2) {
      e.preventDefault();
      document.getElementById('passwordMismatchError').classList.remove('hidden');
      return false;
    }
    return true;
  }
</script>
{% endblock %}
