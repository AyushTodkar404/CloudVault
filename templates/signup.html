{% extends "base.html" %}

{% block title %}Create Account &mdash; CloudVault{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-white border border-[#E9EAEC] rounded-2xl p-7 sm:p-8 shadow-xs relative overflow-hidden">
    
    <!-- Header -->
    <div class="text-center space-y-2 mb-6">
      <div class="w-10 h-10 rounded-xl bg-stone-100 border border-stone-200 text-stone-700 flex items-center justify-center text-sm mx-auto shadow-xs">
        <i class="fa-solid fa-user-plus text-sm"></i>
      </div>
      <h1 class="text-xl font-bold text-[#1C1917] tracking-tight">Create your account</h1>
      <p class="text-xs text-[#78716C]">Store and organize your academic records</p>
    </div>

    <!-- Sign Up Form -->
    <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      
      <!-- Username -->
      <div>
        <label for="username" class="block text-xs font-medium text-stone-700 mb-1.5">
          Username or student ID <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-regular fa-user text-xs"></i>
          </span>
          <input 
            type="text" 
            name="username" 
            id="username" 
            required 
            placeholder="e.g. ayush_todkar"
            class="wm-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-xs font-medium text-stone-700 mb-1.5">
          Institutional email <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-regular fa-envelope text-xs"></i>
          </span>
          <input 
            type="email" 
            name="email" 
            id="email" 
            required 
            placeholder="e.g. student@university.edu"
            class="wm-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-medium text-stone-700 mb-1.5">
          Password <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-solid fa-key text-xs"></i>
          </span>
          <input 
            type="password" 
            name="password" 
            id="password" 
            required 
            minlength="6"
            placeholder="At least 6 characters"
            class="wm-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#777B83] hover:text-[#202124] transition-colors"
            aria-label="Toggle password visibility"
          >
            <i class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>

        <!-- Real-Time Password Strength Meter -->
        <div class="mt-2 space-y-1">
          <div class="flex items-center justify-between text-[11px] text-[#78716C]">
            <span>Strength:</span>
            <span id="strengthText" class="font-medium text-stone-600">Enter password</span>
          </div>
          <div class="w-full bg-[#E9EAEC] h-1.5 rounded-full overflow-hidden flex">
            <div id="strengthBar" class="h-full bg-stone-300 rounded-full transition-all duration-300" style="width: 5%"></div>
          </div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-medium text-stone-700 mb-1.5">
          Confirm password <span class="text-[#9F1239]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-solid fa-shield-halved text-xs"></i>
          </span>
          <input 
            type="password" 
            name="confirm_password" 
            id="confirm_password" 
            required 
            minlength="6"
            placeholder="Repeat password"
            class="wm-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
        </div>
      </div>

      <!-- Role Badge Notice -->
      <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex items-center gap-2.5 text-xs text-stone-700">
        <i class="fa-solid fa-user-graduate text-stone-500 text-sm"></i>
        <span>Account role: Student / Scholar</span>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-white bg-[#9F1239] hover:bg-[#881337] active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-xs"
        >
          <i class="fa-solid fa-circle-check text-xs"></i>
          <span>Create account</span>
        </button>
      </div>

    </form>

    <!-- Footer Switcher -->
    <div class="mt-6 pt-5 border-t border-[#E9EAEC] text-center text-xs text-[#78716C]">
      <span>Already have an account? </span>
      <a href="{{ url_for('login') }}" class="font-medium text-[#9F1239] hover:underline transition-colors">
        Sign in &rarr;
      </a>
    </div>

  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }

  // Real-Time Password Entropy / Strength Calculation
  const pwInput = document.getElementById('password');
  const strengthText = document.getElementById('strengthText');
  const strengthBar = document.getElementById('strengthBar');

  if (pwInput) {
    pwInput.addEventListener('input', () => {
      const val = pwInput.value;
      if (!val) {
        strengthBar.style.width = '5%';
        strengthBar.className = 'h-full bg-stone-300 rounded-full transition-all duration-300';
        strengthText.textContent = 'Enter Password';
        strengthText.className = 'font-medium text-[#78716C]';
        return;
      }

      let score = 0;
      if (val.length >= 6) score += 25;
      if (val.length >= 8) score += 20;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 20;
      if (/[0-9]/.test(val)) score += 20;
      if (/[^A-Za-z0-9]/.test(val)) score += 15;

      strengthBar.style.width = `${score}%`;
      if (score < 40) {
        strengthBar.className = 'h-full bg-[#9F1239] rounded-full transition-all duration-300';
        strengthText.textContent = 'Weak';
        strengthText.className = 'font-medium text-[#9F1239]';
      } else if (score < 70) {
        strengthBar.className = 'h-full bg-amber-500 rounded-full transition-all duration-300';
        strengthText.textContent = 'Moderate';
        strengthText.className = 'font-medium text-amber-700';
      } else {
        strengthBar.className = 'h-full bg-[#166534] rounded-full transition-all duration-300';
        strengthText.textContent = 'Strong';
        strengthText.className = 'font-medium text-[#166534]';
      }
    });
  }
</script>
{% endblock %}
