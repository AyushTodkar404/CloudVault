{% extends "base.html" %}

{% block title %}Sign In &mdash; CloudVault{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-white border border-[#E9EAEC] rounded-2xl p-7 sm:p-8 shadow-xs relative overflow-hidden">
    
    <!-- Header -->
    <div class="text-center space-y-2 mb-7">
      <div class="w-10 h-10 rounded-xl bg-stone-100 border border-stone-200 text-stone-700 flex items-center justify-center text-sm mx-auto shadow-xs">
        <i class="fa-solid fa-lock text-sm"></i>
      </div>
      <h1 class="text-xl font-bold text-[#1C1917] tracking-tight">Sign in to CloudVault</h1>
      <p class="text-xs text-[#78716C]">Sign in to your document vault</p>
    </div>

    <!-- Sign In Form -->
    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      
      <!-- Username or Email -->
      <div>
        <label for="identity" class="block text-xs font-medium text-stone-700 mb-1.5">
          Username or email
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-regular fa-user text-xs"></i>
          </span>
          <input 
            type="text" 
            name="identity" 
            id="identity" 
            required 
            autofocus
            placeholder="Username or institutional email"
            class="wm-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-medium text-stone-700">
            Password
          </label>
          <a href="{{ url_for('forgot_password') }}" class="text-[11px] text-[#9F1239] hover:underline transition-colors font-medium">
            Forgot password?
          </a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-solid fa-key text-xs"></i>
          </span>
          <input 
            type="password" 
            name="password" 
            id="password" 
            required 
            placeholder="••••••••••••"
            class="wm-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#777B83] hover:text-[#202124] transition-colors"
            aria-label="Toggle password visibility"
          >
            <i class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Remember Session Checkbox -->
      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-stone-600 hover:text-stone-900">
          <input 
            type="checkbox" 
            name="remember" 
            class="rounded border-[#E9EAEC] text-[#9F1239] focus:ring-[#9F1239] h-3.5 w-3.5 accent-[#9F1239]"
          >
          <span>Remember me</span>
        </label>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-white bg-[#9F1239] hover:bg-[#881337] active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-xs"
        >
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
          <span>Sign in</span>
        </button>
      </div>

    </form>

    <!-- Social Auth Divider -->
    <div class="my-5 flex items-center gap-3">
      <div class="flex-1 h-[1px] bg-[#E9EAEC]"></div>
      <span class="text-[11px] text-[#78716C]">or continue with</span>
      <div class="flex-1 h-[1px] bg-[#E9EAEC]"></div>
    </div>

    <!-- Google Sign-In Button -->
    <a href="{{ url_for('google_login') }}" class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-[#1C1917] bg-white hover:bg-[#FAFAF9] border border-[#E9EAEC] hover:border-[#D3D5D9] active:scale-[0.99] transition-all flex items-center justify-center gap-3 shadow-xs group">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span class="font-medium text-[#1C1917] transition-colors">Sign in with Google</span>
    </a>

    <!-- Footer Switcher -->
    <div class="mt-6 pt-5 border-t border-[#E9EAEC] text-center text-xs text-[#78716C]">
      <span>Need an institutional account? </span>
      <a href="{{ url_for('signup') }}" class="font-medium text-[#9F1239] hover:underline transition-colors">
        Create account &rarr;
      </a>
    </div>

  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }
</script>
{% endblock %}
