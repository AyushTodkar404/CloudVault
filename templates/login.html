{% extends "base.html" %}

{% block title %}Sign In &mdash; CloudVault{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md quartz-surface rounded-2xl p-7 sm:p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Top Glowing Accent -->
    <div class="absolute -top-12 -right-12 w-28 h-28 bg-violet-600/20 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-28 h-28 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center space-y-2 mb-7">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-600 via-indigo-600 to-amber-500/80 p-[1px] shadow-lg shadow-violet-600/30 mx-auto">
        <div class="w-full h-full bg-[#0d0f17] rounded-[11px] flex items-center justify-center">
          <i class="fa-solid fa-lock text-violet-400 text-lg"></i>
        </div>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">Access CloudVault</h1>
      <p class="text-xs text-slate-400 font-mono">Sign in to your encrypted credential registry</p>
    </div>

    <!-- Sign In Form -->
    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      
      <!-- Username or Email -->
      <div>
        <label for="identity" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5 font-mono">
          Username or Email
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 pointer-events-none">
            <i class="fa-regular fa-user text-xs"></i>
          </span>
          <input 
            type="text" 
            name="identity" 
            id="identity" 
            required 
            autofocus
            placeholder="student_id or institutional email"
            class="quartz-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-slate-500"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 font-mono">
            Password
          </label>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 pointer-events-none">
            <i class="fa-solid fa-key text-xs"></i>
          </span>
          <input 
            type="password" 
            name="password" 
            id="password" 
            required 
            placeholder="••••••••••••"
            class="quartz-input w-full pl-10 pr-10 py-2.5 rounded-xl text-sm placeholder-slate-500"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300 transition-colors"
            aria-label="Toggle password visibility"
          >
            <i class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Remember Session Checkbox -->
      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-slate-200">
          <input 
            type="checkbox" 
            name="remember" 
            class="rounded border-white/20 bg-slate-900 text-violet-600 focus:ring-violet-500 h-3.5 w-3.5 accent-violet-600"
          >
          <span>Keep session authenticated</span>
        </label>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-bold text-xs text-white bg-gradient-to-r from-violet-600 via-indigo-600 to-violet-500 hover:from-violet-500 hover:to-indigo-500 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-lg shadow-violet-600/30 border border-violet-400/30 font-mono"
        >
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
          <span>Authenticate & Open Vault</span>
        </button>
      </div>

    </form>

    <!-- Social Auth Divider -->
    <div class="my-5 flex items-center gap-3">
      <div class="flex-1 h-[1px] bg-white/[0.08]"></div>
      <span class="text-[10px] font-mono uppercase tracking-widest text-slate-500">Or continue with</span>
      <div class="flex-1 h-[1px] bg-white/[0.08]"></div>
    </div>

    <!-- Google Sign-In Button -->
    <a href="{{ url_for('google_login') }}" class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-slate-200 bg-[#12141f] hover:bg-[#181a29] border border-white/[0.12] hover:border-white/20 active:scale-[0.99] transition-all flex items-center justify-center gap-3 shadow-md group">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span class="font-semibold group-hover:text-white transition-colors">Sign in with Google</span>
    </a>

    <!-- Footer Switcher -->
    <div class="mt-6 pt-5 border-t border-white/[0.08] text-center text-xs text-slate-400">
      <span>Need an institutional account? </span>
      <a href="{{ url_for('signup') }}" class="font-semibold text-violet-400 hover:text-violet-300 hover:underline transition-colors">
        Create account &rarr;
      </a>
    </div>

  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  }
</script>
{% endblock %}
