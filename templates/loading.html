<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAF9]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fast fallback redirect for weak connections or disabled JavaScript -->
  <meta http-equiv="refresh" content="2;url={{ next_url }}">
  <title>Signing in &ndash; CloudVault</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%239F1239'/%3E%3Cpath d='M9 13.5V9.5C9 7.57 10.57 6 12.5 6H19.5C21.43 6 23 7.57 23 9.5V13.5M7 13.5H25C25.83 13.5 26.5 14.17 26.5 15V24C26.5 24.83 25.83 25.5 25 25.5H7C6.17 25.5 5.5 24.83 5.5 24V15C5.5 14.17 6.17 13.5 7 13.5ZM16 18V21M17.5 18C17.5 18.83 16.83 19.5 16 19.5C15.17 19.5 14.5 18.83 14.5 18C14.5 17.17 15.17 16.5 16 16.5C16.83 16.5 17.5 17.17 17.5 18Z' stroke='white' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body class="min-h-full flex items-center justify-center p-4 bg-[#FAFAF9] text-[#1C1917] selection:bg-[#9F1239] selection:text-white">

  <!-- Loading Card -->
  <div class="w-full max-w-sm bg-white border border-[#E9EAEC] rounded-2xl p-6 sm:p-8 shadow-xs text-center space-y-5">
    
    <!-- Vault Brand Mark -->
    <div class="w-10 h-10 mx-auto rounded-xl bg-stone-100 border border-stone-200 text-stone-700 flex items-center justify-center text-base shadow-xs">
      <i class="fa-solid fa-lock text-sm"></i>
    </div>

    <!-- Friendly Status Heading -->
    <div class="space-y-1">
      <h1 class="text-base font-semibold text-[#1C1917]">Signing you in...</h1>
      <p class="text-xs text-[#78716C]" id="loadingSubtext">Preparing your vault workspace</p>
    </div>

    <!-- Linear Progress Bar -->
    <div class="w-full bg-[#E9EAEC] h-1.5 rounded-full overflow-hidden">
      <div id="fastProgressBar" class="h-full bg-[#9F1239] rounded-full transition-all duration-300 ease-out" style="width: 15%"></div>
    </div>

    <!-- User Pill -->
    {% if email or name %}
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#FAFAF9] border border-[#E9EAEC] text-xs text-[#78716C] max-w-full">
      <span class="w-1.5 h-1.5 rounded-full bg-[#268B65]"></span>
      <span class="truncate font-medium">{{ name if name else email }}</span>
    </div>
    {% endif %}

  </div>

  <script>
    // Loading transition
    const targetUrl = "{{ next_url or '/' }}";
    const bar = document.getElementById('fastProgressBar');
    const subtext = document.getElementById('loadingSubtext');

    setTimeout(() => {
      if (bar) bar.style.width = '60%';
      if (subtext) subtext.textContent = 'Verifying storage connection...';
    }, 400);

    setTimeout(() => {
      if (bar) bar.style.width = '95%';
      if (subtext) subtext.textContent = 'Opening your records...';
    }, 850);

    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 1250);
  </script>

</body>

</html>
