<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAF9]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fast fallback redirect for weak connections or disabled JavaScript -->
  <meta http-equiv="refresh" content="2;url={{ next_url }}">
  <title>Signing in &ndash; CloudVault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body class="min-h-full flex items-center justify-center p-4 bg-[#FAFAF9] text-[#202124] selection:bg-[#F0445E] selection:text-white">

  <!-- Clean, Human-Designed Loading Card -->
  <div class="w-full max-w-sm bg-white border border-[#E9EAEC] rounded-2xl p-6 sm:p-8 shadow-lg text-center space-y-5">
    
    <!-- Watermelon Brand Mark -->
    <div class="w-12 h-12 mx-auto rounded-2xl bg-[#FFF0F2] border border-[#FECDD3] flex items-center justify-center text-2xl shadow-xs">
      🍉
    </div>

    <!-- Friendly Status Heading -->
    <div class="space-y-1">
      <h1 class="text-base font-semibold text-[#202124]">Signing you in...</h1>
      <p class="text-xs text-[#777B83]" id="loadingSubtext">Preparing your CloudVault workspace</p>
    </div>

    <!-- Fast Linear Progress Bar -->
    <div class="w-full bg-[#E9EAEC] h-1.5 rounded-full overflow-hidden">
      <div id="fastProgressBar" class="h-full bg-gradient-to-r from-[#F0445E] to-[#268B65] rounded-full transition-all duration-300 ease-out" style="width: 15%"></div>
    </div>

    <!-- User Pill (Clean and subtle) -->
    {% if email or name %}
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#FAFAF9] border border-[#E9EAEC] text-xs text-[#5F6368] max-w-full">
      <span class="w-1.5 h-1.5 rounded-full bg-[#268B65]"></span>
      <span class="truncate font-medium">{{ name if name else email }}</span>
    </div>
    {% endif %}

  </div>

  <script>
    // Fast, responsive loading transition (1.2 seconds total)
    const targetUrl = "{{ next_url or '/' }}";
    const bar = document.getElementById('fastProgressBar');
    const subtext = document.getElementById('loadingSubtext');

    // Progress increments
    setTimeout(() => {
      if (bar) bar.style.width = '60%';
      if (subtext) subtext.textContent = 'Connecting storage...';
    }, 400);

    setTimeout(() => {
      if (bar) bar.style.width = '95%';
      if (subtext) subtext.textContent = 'Opening your files...';
    }, 850);

    // Direct, seamless navigation
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 1250);
  </script>

</body>

</html>
