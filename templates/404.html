{% extends "base.html" %}

{% block content %}
<div class="py-24 text-center space-y-6">
  <div class="w-16 h-16 rounded-2xl bg-[#FFF0F2] border border-[#FECDD3] text-[#F0445E] flex items-center justify-center mx-auto text-2xl shadow-xs">
    <i class="fa-solid fa-file-circle-xmark"></i>
  </div>
  <div class="space-y-1.5">
    <h1 class="font-extrabold text-2xl text-[#202124]">404 &mdash; Record Not Found</h1>
    <p class="text-xs text-[#5F6368] max-w-sm mx-auto font-mono">
      The requested document locator or endpoint could not be resolved in this registry instance.
    </p>
  </div>
  <div>
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#F0445E] hover:bg-[#D92D50] text-white font-semibold text-xs transition-all shadow-xs font-mono">
      <i class="fa-solid fa-arrow-left text-[11px]"></i>
      <span>Return to Vault Repository</span>
    </a>
  </div>
</div>
{% endblock %}
