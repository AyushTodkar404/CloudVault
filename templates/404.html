{% extends "base.html" %}

{% block content %}
<div class="py-24 text-center space-y-6">
  <div class="w-16 h-16 rounded-2xl quartz-surface flex items-center justify-center mx-auto text-violet-400 text-2xl shadow-xl border border-violet-500/30">
    <i class="fa-solid fa-file-circle-xmark"></i>
  </div>
  <div class="space-y-1.5">
    <h1 class="font-extrabold text-2xl text-white">404 &mdash; Record Not Found</h1>
    <p class="text-xs text-slate-400 max-w-sm mx-auto font-mono">
      The requested document locator or endpoint could not be resolved in this registry instance.
    </p>
  </div>
  <div>
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-violet-500 hover:from-violet-500 hover:to-indigo-500 text-white font-bold text-xs transition-all shadow-lg shadow-violet-600/25 border border-violet-400/30 font-mono">
      <i class="fa-solid fa-arrow-left text-[11px]"></i>
      <span>Return to Vault Repository</span>
    </a>
  </div>
</div>
{% endblock %}
