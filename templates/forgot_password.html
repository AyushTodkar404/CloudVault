{% extends "base.html" %}

{% block title %}Reset Password &mdash; CloudVault{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-white border border-[#E9EAEC] rounded-2xl p-7 sm:p-8 shadow-xs relative overflow-hidden">
    
    <!-- Header -->
    <div class="text-center space-y-2 mb-7">
      <div class="w-12 h-12 rounded-xl bg-[#FFF0F2] border border-[#FECDD3] text-[#F0445E] flex items-center justify-center text-lg mx-auto shadow-xs">
        <i class="fa-solid fa-key text-base"></i>
      </div>
      <h1 class="text-xl font-bold text-[#202124] tracking-tight">Forgot Password</h1>
      <p class="text-xs text-[#5F6368] font-mono">Enter your username or email to recover access</p>
    </div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-4">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="identity" class="block text-xs font-semibold uppercase tracking-wider text-[#5F6368] mb-1.5 font-mono">
          Username or Email Address <span class="text-[#F0445E]">*</span>
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#777B83] pointer-events-none">
            <i class="fa-regular fa-envelope text-xs"></i>
          </span>
          <input 
            type="text" 
            name="identity" 
            id="identity" 
            required 
            autofocus
            placeholder="student@university.edu or username"
            class="wm-input w-full pl-10 pr-3.5 py-2.5 rounded-xl text-sm placeholder-[#777B83]"
          >
        </div>
        <p class="text-[11px] text-[#777B83] mt-1.5 font-mono">
          We will issue a secure, time-limited cryptographic reset authorization link.
        </p>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 rounded-xl font-bold text-xs text-white bg-[#F0445E] hover:bg-[#D92D50] active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-xs font-mono"
        >
          <i class="fa-solid fa-paper-plane text-xs"></i>
          <span>Send Password Reset Authorization</span>
        </button>
      </div>
    </form>

    <!-- Footer Back Link -->
    <div class="mt-6 pt-5 border-t border-[#E9EAEC] text-center">
      <a href="{{ url_for('login') }}" class="text-xs text-[#5F6368] hover:text-[#202124] font-mono flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>Return to Sign In</span>
      </a>
    </div>

  </div>
</div>
{% endblock %}
