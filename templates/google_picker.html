<!DOCTYPE html>
<html lang="en" class="h-full bg-[#08090d]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in &ndash; Google Accounts</title>

  <!-- Google Fonts: Inter & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .google-card {
      background: #1e1f2b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body class="min-h-full flex items-center justify-center p-4 bg-[#090a0f] text-slate-100 font-sans selection:bg-blue-600/30">

  <div class="w-full max-w-md google-card rounded-3xl p-8 sm:p-9 relative overflow-hidden">
    
    <!-- Google Header -->
    <div class="text-center space-y-3 mb-6">
      <!-- Official Google Multi-color Logo -->
      <svg class="w-9 h-9 mx-auto" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <div>
        <h1 class="text-xl font-medium text-white tracking-tight">Choose an account</h1>
        <p class="text-xs text-slate-400 mt-1">to continue to <span class="text-blue-400 font-semibold">CloudVault</span></p>
      </div>
    </div>

    <!-- Account Selection List -->
    <div class="space-y-2.5">
      
      <!-- Account Option 1: Primary Ayush -->
      <form method="POST" action="{{ url_for('google_login') }}">
        <input type="hidden" name="name" value="Ayush Todkar">
        <input type="hidden" name="email" value="ayushtodkar404@gmail.com">
        <button type="submit" class="w-full text-left p-3.5 rounded-2xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-blue-500/50 transition-all flex items-center justify-between group cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm shadow-md">
              A
            </div>
            <div>
              <p class="text-xs font-semibold text-white group-hover:text-blue-300 transition-colors">Ayush Todkar</p>
              <p class="text-[11px] text-slate-400 font-mono">ayushtodkar404@gmail.com</p>
            </div>
          </div>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 border border-blue-500/30 font-medium">1-Click</span>
        </button>
      </form>

      <!-- Account Option 2: University Scholar Account -->
      <form method="POST" action="{{ url_for('google_login') }}">
        <input type="hidden" name="name" value="Scholar Account">
        <input type="hidden" name="email" value="scholar@university.edu">
        <button type="submit" class="w-full text-left p-3.5 rounded-2xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-blue-500/50 transition-all flex items-center justify-between group cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center text-sm shadow-md">
              S
            </div>
            <div>
              <p class="text-xs font-semibold text-white group-hover:text-blue-300 transition-colors">Scholar Account</p>
              <p class="text-[11px] text-slate-400 font-mono">scholar@university.edu</p>
            </div>
          </div>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-purple-500/15 text-purple-400 border border-purple-500/30 font-medium">Scholar</span>
        </button>
      </form>

      <!-- Account Option 3: Custom Google Account Input -->
      <div class="pt-2">
        <details class="group">
          <summary class="list-none text-left p-3.5 rounded-2xl bg-white/[0.02] hover:bg-white/[0.06] border border-white/[0.06] transition-all flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 rounded-full bg-white/[0.06] text-slate-300 flex items-center justify-center text-sm">
              <i class="fa-solid fa-user-plus text-xs"></i>
            </div>
            <div class="flex-1">
              <p class="text-xs font-semibold text-slate-200">Use another Google account</p>
              <p class="text-[10px] text-slate-400 font-mono">Type any Google email</p>
            </div>
            <i class="fa-solid fa-chevron-down text-xs text-slate-500 group-open:rotate-180 transition-transform"></i>
          </summary>
          
          <form method="POST" action="{{ url_for('google_login') }}" class="mt-3 p-3.5 rounded-xl bg-black/40 border border-white/[0.08] space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-mono text-slate-400 mb-1">Google Email Address</label>
              <input type="email" name="email" required placeholder="username@gmail.com" class="w-full px-3 py-2 rounded-xl text-xs bg-[#12141f] border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-[10px] uppercase font-mono text-slate-400 mb-1">Full Name (Optional)</label>
              <input type="text" name="name" placeholder="e.g. John Doe" class="w-full px-3 py-2 rounded-xl text-xs bg-[#12141f] border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
              <span>Continue with this Account</span>
            </button>
          </form>
        </details>
      </div>

    </div>

    <!-- Google Disclaimer & Notice -->
    <div class="mt-8 pt-4 border-t border-white/[0.08] text-center space-y-3">
      <p class="text-[11px] text-slate-400 leading-relaxed">
        To continue, Google will securely share your name, email address, and language preference with CloudVault.
      </p>
      <div class="flex items-center justify-center gap-4 text-xs font-mono">
        <a href="{{ url_for('login') }}" class="text-slate-400 hover:text-white transition-colors">
          &larr; Cancel and return
        </a>
      </div>
    </div>

  </div>

</body>

</html>
