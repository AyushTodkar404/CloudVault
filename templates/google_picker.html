<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAF9]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in &ndash; Google Accounts</title>

  <!-- Modern Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-full flex items-center justify-center p-4 bg-[#FAFAF9] text-[#202124] font-sans selection:bg-[#F0445E] selection:text-white">

  <div class="w-full max-w-md bg-white border border-[#E9EAEC] rounded-3xl p-8 sm:p-9 shadow-xs relative overflow-hidden">
    
    <!-- Google Header -->
    <div class="text-center space-y-3 mb-6">
      <!-- Official Google Multi-color Logo -->
      <svg class="w-9 h-9 mx-auto" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <div>
        <h1 class="text-xl font-semibold text-[#202124] tracking-tight">Choose an account</h1>
        <p class="text-xs text-[#5F6368] mt-1">to continue to <span class="text-[#F0445E] font-semibold">CloudVault</span></p>
      </div>
    </div>

    <!-- Account Selection List -->
    <div class="space-y-2.5">
      
      <!-- Account Option 1: Primary Ayush -->
      <form method="POST" action="{{ url_for('google_login') }}">
        <input type="hidden" name="name" value="Ayush Todkar">
        <input type="hidden" name="email" value="ayushtodkar404@gmail.com">
        <button type="submit" class="w-full text-left p-3.5 rounded-2xl bg-[#FAFAF9] hover:bg-[#FFF0F2] border border-[#E9EAEC] hover:border-[#FECDD3] transition-all flex items-center justify-between group cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#F0445E] text-white font-bold flex items-center justify-center text-sm shadow-xs">
              A
            </div>
            <div>
              <p class="text-xs font-semibold text-[#202124] group-hover:text-[#F0445E] transition-colors">Ayush Todkar</p>
              <p class="text-[11px] text-[#5F6368] font-mono">ayushtodkar404@gmail.com</p>
            </div>
          </div>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-[#EAF6EF] text-[#268B65] border border-[#BEE7D5] font-medium">1-Click</span>
        </button>
      </form>

      <!-- Account Option 2: University Scholar Account -->
      <form method="POST" action="{{ url_for('google_login') }}">
        <input type="hidden" name="name" value="Scholar Account">
        <input type="hidden" name="email" value="scholar@university.edu">
        <button type="submit" class="w-full text-left p-3.5 rounded-2xl bg-[#FAFAF9] hover:bg-[#FFF0F2] border border-[#E9EAEC] hover:border-[#FECDD3] transition-all flex items-center justify-between group cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#268B65] text-white font-bold flex items-center justify-center text-sm shadow-xs">
              S
            </div>
            <div>
              <p class="text-xs font-semibold text-[#202124] group-hover:text-[#F0445E] transition-colors">Scholar Account</p>
              <p class="text-[11px] text-[#5F6368] font-mono">scholar@university.edu</p>
            </div>
          </div>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-[#FFF0F2] text-[#F0445E] border border-[#FECDD3] font-medium">Scholar</span>
        </button>
      </form>

      <!-- Account Option 3: Custom Google Account Input -->
      <div class="pt-2">
        <details class="group">
          <summary class="list-none text-left p-3.5 rounded-2xl bg-[#FAFAF9] hover:bg-white border border-[#E9EAEC] transition-all flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 rounded-full bg-white text-[#5F6368] border border-[#E9EAEC] flex items-center justify-center text-sm">
              <i class="fa-solid fa-user-plus text-xs"></i>
            </div>
            <div class="flex-1">
              <p class="text-xs font-semibold text-[#202124]">Use another Google account</p>
              <p class="text-[10px] text-[#5F6368] font-mono">Type any Google email</p>
            </div>
            <i class="fa-solid fa-chevron-down text-xs text-[#777B83] group-open:rotate-180 transition-transform"></i>
          </summary>
          
          <form method="POST" action="{{ url_for('google_login') }}" class="mt-3 p-3.5 rounded-xl bg-[#FAFAF9] border border-[#E9EAEC] space-y-3">
            <div>
              <label class="block text-[10px] uppercase font-mono text-[#5F6368] mb-1 font-semibold">Google Email Address</label>
              <input type="email" name="email" required placeholder="username@gmail.com" class="w-full px-3 py-2 rounded-xl text-xs bg-white border border-[#E9EAEC] text-[#202124] placeholder-[#777B83] focus:outline-none focus:border-[#F0445E]">
            </div>
            <div>
              <label class="block text-[10px] uppercase font-mono text-[#5F6368] mb-1 font-semibold">Full Name (Optional)</label>
              <input type="text" name="name" placeholder="e.g. John Doe" class="w-full px-3 py-2 rounded-xl text-xs bg-white border border-[#E9EAEC] text-[#202124] placeholder-[#777B83] focus:outline-none focus:border-[#F0445E]">
            </div>
            <button type="submit" class="w-full py-2 px-3 rounded-xl bg-[#F0445E] hover:bg-[#D92D50] text-white font-semibold text-xs transition-colors flex items-center justify-center gap-2 shadow-xs">
              <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
              <span>Continue with this Account</span>
            </button>
          </form>
        </details>
      </div>

    </div>

    <!-- Google Disclaimer & Notice -->
    <div class="mt-8 pt-4 border-t border-[#E9EAEC] text-center space-y-3">
      <p class="text-[11px] text-[#5F6368] leading-relaxed">
        To continue, Google will securely share your name, email address, and language preference with CloudVault.
      </p>
      <div class="flex items-center justify-center gap-4 text-xs font-mono">
        <a href="{{ url_for('login') }}" class="text-[#5F6368] hover:text-[#202124] transition-colors">
          &larr; Cancel and return
        </a>
      </div>
    </div>

  </div>

</body>

</html>
